name: Apply Web Production Database Migrations

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/prisma/migrations/**'
      - 'apps/web/prisma/schema.prisma'
      - 'apps/web/prisma/schema.zmodel'
      - 'apps/web/prisma/models/**'

concurrency:
  group: web-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma Database Migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install

      - name: Install Doppler CLI
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73

      - name: Run Prisma Migrations
        run: doppler run -- bun --cwd apps/web db:migrate-prod
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Verify migrations are applied
        run: doppler run -c prd -- bun --cwd apps/web db:check-migrations
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REQUIRE_MIGRATIONS: "true"
