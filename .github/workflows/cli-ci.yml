name: CLI CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "packages/cli/**"
      - "packages/shared/**"
      - "packages/config/**"
      - "apps/web/src/server/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "packages/cli/**"
      - "packages/shared/**"
      - "packages/config/**"
      - "apps/web/src/server/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/cli-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_ENV: test
  CI: "true"
  SKIP_ENV_VALIDATION: "true"
  NEXT_TELEMETRY_DISABLED: 1
  # prisma.config.ts refuses to load without both. They must match the postgres service below,
  # because the SQL generator resolves prisma/sql/*.sql against a live connection.
  DATABASE_URL: postgresql://user:password@localhost:5432/test_db
  DIRECT_URL: postgresql://user:password@localhost:5432/test_db

jobs:
  tests:
    name: Run CLI Tests
    if: github.actor != 'ImgBotApp'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `prisma generate --sql` reads prisma/sql/*.sql against a live connection, so the type
    # check needs a real database, not just the env vars.
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Cache Bun Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Turborepo Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      # The CLI imports @doxynix/web for types only, so no workspace build or
      # database is needed here — only bun install.
      - name: Run CLI Tests with Coverage
        run: bun --filter @doxynix/cli test:coverage

      - name: Check Formatting
        run: bun --filter @doxynix/cli format:check

      - name: Lint
        run: bun --filter @doxynix/cli lint

      - name: Check Architecture Boundaries
        run: bun --filter @doxynix/cli arch:check

      # cli type-checks against apps/web sources via @doxynix/web/trpc, which re-exports the
      # generated Prisma client. This step bypasses turbo, so set it up explicitly: the SQL
      # generator resolves prisma/sql/*.sql against real tables, hence push before generate.
      - name: Push Database Schema
        run: bun --filter @doxynix/web db:push

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate

      - name: Type Check
        run: bun --filter @doxynix/cli type-check

      - name: Build CLI
        run: bun --filter @doxynix/cli build

      - name: Smoke-run Built Binary
        run: node packages/cli/dist/index.js --version

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/cli/coverage/coverage-final.json
          flags: cli
          fail_ci_if_error: false