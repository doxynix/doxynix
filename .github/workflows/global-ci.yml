name: Global Repository CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: global-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Global Quality 
    if: github.actor != 'ImgBotApp'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Check for Typos (CSpell)
        run: bun run spellcheck
        continue-on-error: true

      - name: Check Code Duplication (JSCPD)
        run: bun run dup

      - name: Find Unused Code (Knip)
        run: bun run knip

  security:
    name: Global Security Scanning
    if: github.actor != 'ImgBotApp'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Run Secretlint
        run: bun run secretlint

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@bff3d2670b362bbb4a0bcdeffea146cbc2ad3abd
        with:
          path: ./
          extra_args: --only-verified

      - name: Security audit
        run: bun audit
        continue-on-error: true

      - name: Snyk Open Source (SCA)
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        with:
          args: --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      - name: Run Snyk Code scan (SAST)
        run: snyk code test . --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true