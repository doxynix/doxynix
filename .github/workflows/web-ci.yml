name: Web CI

permissions:
  contents: read
  pull-requests: write
  statuses: write

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/web-ci.yml"
  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: "true"
  SKIP_ENV_VALIDATION: "true"
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: "--max-old-space-size=6144"
  PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
  DATABASE_URL: postgresql://user:password@localhost:5432/test_db
  DIRECT_URL: postgresql://user:password@localhost:5432/test_db
  NEXTAUTH_URL: "http://localhost:3000"
  JWT_SECRET: "dummy-jwt-secret"
  TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  RESEND_API_KEY: "re_dummy_123"
  ABLY_API_KEY: "dummy:key"
  GITHUB_APP_ID: "123456"
  GITHUB_APP_PRIVATE_KEY: "dummy-private-key"
  GITHUB_SYSTEM_INSTALLATION_ID: "999999"
  GITHUB_WEBHOOK_SECRET: "dummy"
  GROQ_API_KEY: "gsk_dummy"
  UPLOADTHING_TOKEN: "eyJdummy.token"
  UPSTASH_REDIS_REST_URL: "https://dummy-redis.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "dummy-token"
  GITHUB_CLIENT_ID: "dummy"
  GITHUB_CLIENT_SECRET: "dummy"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "dummy"
  GOOGLE_CLIENT_SECRET: "dummy"
  GITLAB_CLIENT_ID: "dummy"
  GITLAB_CLIENT_SECRET: "dummy"
  YANDEX_CLIENT_ID: "dummy"
  YANDEX_CLIENT_SECRET: "dummy"

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init CI metadata
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.time.outputs.started_at }}
    steps:
      - name: Save CI start time
        id: time
        run: echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

  changes:
    needs: [init]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@61f87a10cd2c304679af17bb73ef192addf33c1c
        id: filter
        with:
          base: ${{ github.base_ref || 'main' }}
          filters: |
            backend:
              - 'package.json'
              - 'bun.lock'
              - 'vitest.config.ts'
              - 'prisma/**'
              - 'src/server/**'
              - 'src/app/api/**'
              - 'src/shared/**'
              - 'src/tests/**'
              - 'apps/web/**'

  quality:
    needs: [init]
    if: github.actor != 'ImgBotApp'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Check Formatting
        run: bun --filter @doxynix/web format:check

      - name: Linting
        run: bun --filter @doxynix/web lint

  types:
    needs: [init]
    if: github.actor != 'ImgBotApp'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Prepare Database Schema
        run: bun --filter @doxynix/web db:push
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db
          DIRECT_URL: postgresql://user:password@localhost:5432/test_db

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db
          DIRECT_URL: postgresql://user:password@localhost:5432/test_db

      - name: Type Checking
        run: bun --filter @doxynix/web type-check

      # - name: Check Type Coverage
      #   run: bun --filter @doxynix/web type-check:coverage

  tests:
    needs: [changes, init]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Verify Database Schema
        run: bun --filter @doxynix/web db:push

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate

      - name: Run Tests with Coverage
        run: bun --filter @doxynix/web test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unit
          fail_ci_if_error: false

  build:
    needs: [quality, types, tests, changes, init]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: |
      always() && github.actor != 'ImgBotApp' &&
      needs.quality.result == 'success' &&
      needs.types.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Clean tree-sitter symlinks
        run: bun run clean:symlinks

      - name: Prepare Database Schema
        run: bun --filter @doxynix/web db:push

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate

      - name: Cache Next.js build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: bun --filter @doxynix/web build:turbopack

      - name: Upload Build Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: next-build
          path: |
            apps/web/.next
            apps/web/public
            package.json
            bun.lock
          retention-days: 1

      - name: Upload webpack stats artifact
        if: hashFiles('apps/web/.next/webpack-stats.json') != ''
        uses: relative-ci/agent-upload-artifact-action@817b17affc58e350258bd97d783db67be5bf0405
        with:
          webpackStatsFile: apps/web/.next/webpack-stats.json

  # ------------------------------------------------------------------
  # 7. LIGHTHOUSE CI (PERFORMANCE)
  # ------------------------------------------------------------------
  lighthouse:
    needs: [build, init]
    # if: >-
    #   needs.build.result == 'success' &&
    #   github.actor != 'ImgBotApp' &&
    #   github.event.pull_request.user.type != 'Bot' &&
    #   !contains(github.actor, '[bot]')
    if: false 
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    timeout-minutes: 60
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Setup DB Schema
        run: bun --filter @doxynix/web db:push

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate

      - name: Build app
        run: bun --filter @doxynix/web build

      - name: Run Lighthouse CI
        run: bun --filter @doxynix/web exec lhci autorun

  # ------------------------------------------------------------------
  # 8 E2E Tests (PLAYWRIGHT)
  # ------------------------------------------------------------------
  e2e:
    needs: [build, init, changes]
    # if: |
    #   needs.build.result == 'success' &&
    #   github.actor != 'ImgBotApp' &&
    #   github.event.pull_request.user.type != 'Bot' &&
    #   !contains(github.actor, '[bot]') &&
    #   (github.ref == 'refs/heads/main' ||
    #   github.ref == 'refs/heads/develop' ||
    #   needs.changes.outputs.backend == 'true')
    if: false 
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Download Build
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: next-build
          path: .

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Setup DB Schema
        run: bun --filter @doxynix/web db:push

      - name: Prisma Generate
        run: bun --filter @doxynix/web db:generate

      - name: Run Playwright tests
        run: bun --filter @doxynix/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: playwright-report
          path: apps/web/src/tests/e2e/playwright-report/
          retention-days: 7
