language: en-US
tone_instructions: "Be professional yet friendly. Focus on SIEM system architecture, security, and performance. Do not nitpick minor stylistic details unless they break application logic or type safety."

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  sequence_diagrams: true
  poem: false
  drafts: false

  path_filters:
    - "!bun.lock"
    - "!.turbo/**"
    - "!client/dist/**"
    - "!coverage/**"
    - "!*.svg"

  path_instructions:
    - path: "client/src/{shared,entities,features,widgets}/**/*.{ts,tsx}"
      instructions: "The frontend application follows Feature-Sliced Design (FSD). Strictly enforce layer import rules: upper layers cannot be imported by lower layers (shared -> entities -> features -> widgets). Cross-imports between slices on the same layer are strictly forbidden."

    - path: "client/src/routes/**/*.{ts,tsx}"
      instructions: "These are TanStack Router route definitions. Ensure strict type safety for route parameters, proper usage of routing hooks, and clean component structure."

    - path: "server/src/db/**/*.{ts,tsx}"
      instructions: "This is the Drizzle ORM schema and migration layer for PostgreSQL. Check column types, secondary indexes, and foreign key integrity."

    - path: "server/src/**/*.ts"
      instructions: "This is the backend server powered by Bun / Hono. Verify strict Zod input validation, proper error handling, and structured logging with Axiom."

  auto_review:
    enabled: false
    drafts: false

  tools:
    biome:
      enabled: true
      args: ["lint", "--write"] 
    eslint:
      enabled: false
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    trufflehog:
      enabled: true
    prismaLint:
      enabled: false

    phpstan: { enabled: false }
    phpmd: { enabled: false }
    phpcs: { enabled: false }
    golangci-lint: { enabled: false }
    swiftlint: { enabled: false }
    rubocop: { enabled: false }
    detekt: { enabled: false }
    flake8: { enabled: false }
    pylint: { enabled: false }
    checkmake: { enabled: false }
    psscriptanalyzer: { enabled: false }

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true

code_generation:
  docstrings:
    language: en-US