pre-commit:
  parallel: true
  jobs:
    - name: branch-check
      run: bun scripts/check-branch-name.ts

    - name: check-lockfile
      glob: "{package.json,apps/*/package.json,packages/*/package.json,bun.lock}"
      run: bun install --frozen-lockfile

    - name: biome-format-and-check
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css,md,mdx}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: oxlint
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bunx oxlint -c .oxlintrc.json {staged_files}

    - name: spell-check
      glob: "**/*.{js,ts,jsx,tsx,md,mdx}"
      run: bunx cspell lint --no-summary --no-progress --no-must-find-files {staged_files}

    - name: secretlint
      run: bunx secretlint {staged_files}

    - name: arch-check
      run: bun scripts/arch-check.ts {staged_files}

prepare-commit-msg:
  commands:
    ticket-inject:
      run: bun scripts/inject-ticket.ts {1}

commit-msg:
  commands:
    commit-check:
      run: bun scripts/check-commit-name.ts {1}

pre-push:
  parallel: true
  jobs:
    - name: branch-check
      run: bun scripts/check-branch-name.ts

    - name: type-check
      run: bun run type-check

post-checkout:
  commands:
    branch-check:
      run: bun scripts/check-branch-name.ts

post-merge:
  commands:
    install:
      run: bun install