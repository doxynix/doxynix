pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    spell-check:
      glob: "*.{js,ts,jsx,tsx,md}"
      run: bunx cspell lint --no-summary --no-progress --no-must-find-files {staged_files}

    secretlint:
      run: bunx secretlint {staged_files}

    arch-check:
      run: bun scripts/arch-check.ts {staged_files}

prepare-commit-msg:
  commands:
    ticket-inject:
      run: bun scripts/inject-ticket.ts {1}

commit-msg:
  commands:
    commit-check:
      run: bun scripts/check-commit-name.ts {1}

pre-push:
  parallel: true
  commands:
    type-check:
      run: bun run type-check 

post-merge:
  commands:
    install:
      run: bun install