
pull_request_rules:
  - name: label hotfixes automatically
    conditions:
      - head ~= ^hotfix/
    actions:
      label:
        add: ["hotfix"]

  - name: automatic merge for Kramarich0
    conditions:
      - author = Kramarich0
      - approved-reviews-by = coderabbitai[bot]
      - -draft
      - -conflict
      - "#check-pending = 0"
      - "#check-failure = 0"
      - "-title ~= (?i)(wip|draft|🚧)"
    actions:
      merge:
        method: squash
        commit_message_format:
          title: pr-title
          body: pr-body
      comment:
        message: "Hey @Kramarich0! All CI checks and CodeRabbit review passed. Merging directly into main! 🚀"

  - name: automatic merge for release-please
    conditions:
      - author = doxynix-release-bot[bot]
      - -draft
      - -conflict
      - "#check-pending = 0"
      - "#check-failure = 0"
    actions:
      merge:
        method: squash

  - name: automatic merge for dependencies
    conditions:
      - or:
          - author = renovate[bot]
          - author = dependabot[bot]
          - author = doxynix-deps-bot[bot]
      - -draft
      - -conflict
      - "#check-pending = 0"
      - "#check-failure = 0"
      - -label = "major-update"
    actions:
      merge:
        method: squash
        commit_message_format:
          title: pr-title
          body: pr-body
      comment:
        message: "Dependencies updated and CI verified. Merging automatically to keep the monorepo fresh! 📦"

  - name: label on conflicts
    conditions:
      - conflict
      - -closed
    actions:
      label:
        add: ["conflict"]
      comment:
        message: "Oops, @{{author}}, it seems there is a merge conflict. Please resolve it manually to unblock the PR! 🛠️"

merge_protections_settings:
  reporting_method: check-runs